# frontend/nginx.conf - AI 客服前端生产配置
# 行为与本地开发 vite 代理保持一致：/api/* → backend:8000/*（剥离 /api 前缀）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容 hash 的静态资源：长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理（覆盖全部 24 条路由 + SSE）
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== SSE 关键配置（P1 event-stream，/chat 流式输出）=====
        # 关闭缓冲：逐 chunk 转发，打字机效果不被攒包
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # HTTP/1.1 长连接（SSE 必需）
        proxy_set_header Connection "";
        # SSE 长流（LLM 生成 + 模板降级逐字延迟）不被 60s 默认超时切断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Vue Router history 模式：前端路由 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
